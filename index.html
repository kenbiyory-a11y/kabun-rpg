<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カブーンのせいちょう物語</title>
<meta name="description" content="ペットのカブトムシ「カブーン」をクイズで育てるレトロRPG風の知育ゲーム">
<meta name="theme-color" content="#1b1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カブーン">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="console">
  <div class="label">カブーンの せいちょう物語</div>
  <div class="screen">
    <div class="field" id="field"></div>
    <div class="msgbox" id="msgbox"></div>
  </div>
  <div class="nav" id="nav">
    <button class="nb" data-tab="growth">📈 せいちょう</button>
    <button class="nb" data-tab="battle">⚔️ バトル</button>
    <button class="nb" data-tab="diary">📖 ものがたり</button>
    <button class="nb gear" data-tab="settings" aria-label="おうちのひと むけ せってい">⚙️</button>
  </div>
</div>
<p class="foot">データ・写真・動画はこの端末に保存されます。⚙️ からバックアップの保存・読み込みとBGMの設定ができます</p>

<div id="theater" hidden>
  <div class="tbar"><span class="tcount" id="tCount"></span><button id="tClose" aria-label="とじる">✕ とじる</button></div>
  <div class="stage" id="stage">
    <img class="bgblur" id="slBg" alt="">
    <img class="slide" id="slA" alt=""><img class="slide" id="slB" alt="">
    <video class="slide" id="slV" playsinline preload="auto"></video>
    <div class="tcap" id="tCap"></div>
    <div class="tcard" id="tCard"></div>
  </div>
  <div class="tbar"><button id="tBgm">♪ BGM</button><button id="tSound" hidden>🔊 どうがの おとを だす</button><span class="tcount" id="tHint">タップで つぎへ</span></div>
</div>

<div id="update" class="update" hidden role="status">
  <span>あたらしい バージョンが あります</span>
  <button id="updateBtn" class="wide">🔄 さいよみこみ</button>
</div>

<!-- 読み込み順に意味があります（後のファイルが前のファイルの関数・定数を使います） -->
<script src="./vendor/jszip.min.js" defer></script>
<script src="./js/data.js" defer></script>
<script src="./js/quiz.js" defer></script>
<script src="./js/state.js" defer></script>
<script src="./js/media.js" defer></script>
<script src="./js/backup.js" defer></script>
<script src="./js/bgm.js" defer></script>
<script src="./js/theater.js" defer></script>
<script src="./js/render.js" defer></script>
<script src="./js/diary.js" defer></script>
<script src="./js/settings.js" defer></script>
<script src="./js/app.js" defer></script>
</body>
</html>
